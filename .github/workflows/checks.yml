name: Release checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev --include=optional
      - run: npx tsc --noEmit
      - run: node tests/contact-migration.mjs
      - run: node tests/legal-pages.mjs
      - run: node tests/chat-release.mjs
      - run: node tests/market-readiness.mjs
      - run: node tests/crm-server-test.mjs
      - run: npm run build
      - run: npm run lint
